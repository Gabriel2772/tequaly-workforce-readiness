[project]
name = "tequaly-workforce-readiness-backend"
version = "0.1.0"
description = "Deterministic workforce readiness and optimization backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<1.19",
  "fastapi>=0.116,<1",
  "httpx2>=2,<3",
  "openpyxl>=3.1,<4",
  "mcp>=2,<3",
  "ortools>=9.14,<10",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv]
package = false
